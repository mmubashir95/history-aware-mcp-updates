[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-history-aware-security"
version = "0.1.0"
description = "Reproducible research pipeline for history-aware MCP update security."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_history_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
